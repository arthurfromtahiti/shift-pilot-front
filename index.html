<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Shift Pilot — Commandes</title>
</head>
<body>
<h1>Commandes actives</h1>
<label for="order-id-search">N° de commande :</label>
<input type="number" id="order-id-search" placeholder="Ex : 42" min="1" />
<button id="order-id-search-btn">Rechercher</button>
<div id="order-id-result"></div>
<label for="status-filter">Statut :</label>
<select id="status-filter">
  <option value="">Tous</option>
  <option value="paid">Payé</option>
  <option value="cancelled">Annulé</option>
</select>
<button id="export-csv-btn">Exporter en CSV</button>
<span id="export-csv-message"></span>
<ul id="orders-list"></ul>
<script type="module" src="js/app.js"></script>
</body>
</html>
