# Impact onboarding : NON
# PR d'intégration SHIAAAAAAAAAAAAAAAAAAAAAAAA-605 — Retrouver une commande par numéro.
# Suite complète : Jest (unitaire) + Playwright E2E (4 scénarios d'acceptation métier).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E acceptance tests (SHIAAAAAAAAAAAAAAAAAAAAAAAA-605)
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
