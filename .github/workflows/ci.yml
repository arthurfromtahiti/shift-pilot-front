# Tests d'acceptation SHIAAAAAAAAAAAAAAAAAAAAAAAA-605 inclus (plan QA, en parallèle du dev).
# État attendu sur cette PR QA : CI ROUGE — les tests S1/S2/S3/S4 + HTML + loader + câblage
# sont intentionnellement rouges (searchOrderById absent, éléments HTML absents).
# Ils passeront au vert une fois la PR feature SHIAAAAAAAAAAAAAAAAAAAAAAAA-614 mergée.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
