# Impact onboarding : NON
# Tests d'acceptation SHIAAAAAAAAAAAAAAAAAAAAAAAA-605 — plan QA en parallèle du dev.
# Cette PR cible la branche SHIAAAAAAAAAAAAAAAAAAAAAAAA-614 (feature front) qui fournit
# l'implémentation de searchOrderById. La CI est VERTE sur l'assemblage 614+615.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
