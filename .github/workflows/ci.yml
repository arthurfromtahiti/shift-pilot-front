# Impact onboarding : NON
# Tests d'acceptation SHIAAAAAAAAAAAAAAAAAAAAAAAA-605 inclus (plan QA, en parallèle du dev).
# État attendu sur cette PR : 8 tests rouges (S1/S2/S4 + contrôle index.html) — ils passeront
# au vert quand la PR feature SHIAAAAAAAAAAAAAAAAAAAAAAAA-605 sera soumise et mergée.
# La CI doit être verte sur la PR feature ; elle est légitimement rouge sur cette PR plan QA.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
