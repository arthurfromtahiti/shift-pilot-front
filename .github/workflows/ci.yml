# Impact onboarding : NON
# Tests d'acceptation SHIAAAAAAAAAAAAAAAAAAAAAAAA-605 (recherche par numéro de commande).
# Les tests searchOrderById seront ROUGES jusqu'au merge de la PR feature — c'est attendu.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
